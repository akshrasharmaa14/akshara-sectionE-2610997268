<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Explorer</title>
</head>
<body>

    <h1>World Map Explorer</h1>
    <p>Click on different regions of the world map to learn about countries.</p>

    <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg"
         alt="Clickable World Map"
         usemap="#worldmap"
         width="800">

    <map name="worldmap">


        <area shape="circle"
              coords="545,300,35"
              href="https://en.wikipedia.org/wiki/India"
              alt="India"
              target="_blank">

  
        <area shape="rect"
              coords="620,390,730,470"
              href="https://en.wikipedia.org/wiki/Australia"
              alt="Australia"
              target="_blank">

        <area shape="poly"
              coords="100,120,180,100,250,130,230,190,160,200,110,170"
              href="https://en.wikipedia.org/wiki/United_States"
              alt="United States of America"
              target="_blank">

        <area shape="default"
              href="https://en.wikipedia.org/wiki/World"
              alt="Explore information about the world"
              target="_blank">

    </map>

</body>
</html>
